[package]
name = "obd-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for OBD-II diagnostics via ELM327"
license = "MIT"

[[bin]]
name = "obd"
path = "src/main.rs"

[dependencies]
obd-core = { path = "../obd-core" }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
